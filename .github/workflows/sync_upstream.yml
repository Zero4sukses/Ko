name: Sync with Upstream

on:
  schedule:
    - cron: '0 3 * * 1' # Sinkronisasi otomatis setiap hari Senin pukul 03:00 pagi (tidak terlalu sering agar aman)
  workflow_dispatch:     # Tombol manual di tab Actions GitHub

permissions:
  contents: write

concurrency:
  group: git-write-lock
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Your Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add Upstream Remote and Pull
        run: |
          git remote add upstream https://github.com/karya-media/media.git
          git fetch upstream
          git checkout main || git checkout master
          
          # Menggabungkan pembaruan dari upstream, dan mengutamakan file kustom Anda jika terjadi konflik
          git merge upstream/main --allow-unrelated-histories -X ours --no-edit || git merge upstream/master --allow-unrelated-histories -X ours --no-edit

      - name: Push Changes to Your Repository
        run: |
          git push origin main || git push origin master
